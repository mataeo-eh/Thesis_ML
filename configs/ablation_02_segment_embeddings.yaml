extends: local_overfit_v2.yaml

# ABLATION ARM 2 of 5 -- segment_embeddings ONLY.
#
# See configs/ablation_01_frozen_input_kv.yaml for the full rationale behind the
# separate storage paths and behind the 100-epoch / 3400-step run length that
# every arm inherits from configs/local_overfit_v2.yaml and runs to completion
# (no `--max-steps` cap); both apply identically to every arm in this sweep.
storage:
  checkpoint_uri: checkpoints/ablations/02-segment-embeddings-only
  log_uri: tests/output/ablations/02-segment-embeddings-only
  local_cache_dir: .pipeline_cache/ablations/02-segment-embeddings-only

model:
  frozen_input_kv: false
  segment_embeddings: true
  per_segment_positions: false

extends: local_overfit.yaml

# V2 overfit profile -- the learnability probe. Its question is narrow: on a
# small, deliberately median-sized subset, does the full current pipeline
# (uniform diffusion, dense GeGLU/sandwich-RMSNorm backbone, joint static
# conditioning, clamped fogged input) drive the loss down at all? A run that
# cannot overfit 10 replays will not learn 870.
#
# The data subset and model scale are inherited from local_overfit.yaml
# unchanged. This file redirects the output paths so V2 runs never mix with V1
# artifacts, pins the diffusion process, and owns the run length and LR decay
# shape for itself and for every configs/ablation_*.yaml arm that extends it.

storage:
  checkpoint_uri: checkpoints/local-overfitV2
  log_uri: tests/output/overfitV2
  local_cache_dir: .pipeline_cache/local-overfitV2

train:
  # 100 epochs, overriding the 150 inherited from local_overfit.yaml. This is
  # the SAME length the five ablation arms run for (they extend this file), so
  # V2 and every arm now share one step budget -- 34 optimizer steps/epoch x 100
  # = 3400 -- and their epoch_metrics.csv rows are comparable epoch for epoch
  # without any per-arm step cap in the launcher.
  #
  # `max_steps` stays at the inherited 0, which is what makes the LR horizon
  # DERIVED: train_pipeline injects optimizer_steps_per_epoch * epochs (= 3400) as
  # train.max_steps, and both the LR decay (TrainingLoop._lr_multiplier) and the
  # EMA window (TrainingLoop._resolve_ema_decay) are fitted to exactly that. So
  # changing `epochs` here re-fits both schedules automatically; nothing else
  # needs to be touched.
  epochs: 100
  # LINEAR decay to a 0.03 floor, replacing the inherited cosine-to-0.1.
  #
  # WHY, from the V2 and ablation loss curves: overall loss and most per-class
  # losses stopped descending partway through and instead hovered inside a band,
  # dipping deeper on some epochs and rebounding on others. That is the signature
  # of a learning rate that stayed too high for too long relative to how far the
  # model had already converged -- the step size, not the gradient, was setting
  # the noise floor. Three changes, all in that direction:
  #
  #   - shape cosine -> linear: the half-cosine lingers near the peak for the
  #     first ~15% of the decay; the linear shape starts descending immediately,
  #     so less of the run is spent at the highest rate.
  #   - the same linear slope is SHALLOWER through the middle of training than
  #     the cosine's steepest section (cosine peaks at pi/2 ~= 1.57x the
  #     straight-line slope), so the rate comes down more evenly instead of
  #     collapsing across the middle third and then flattening.
  #   - floor 0.1 -> 0.03: the run now ends at 9.0e-6 rather than 3.0e-5. The
  #     end-of-training gradient-noise floor scales with the final lr, so this is
  #     the part that should actually shrink the hovering band and let the last
  #     epochs settle into a minimum instead of bouncing around one.
  #
  # Both knobs default to cosine / 0.1 in config/default.yaml, so local_full.yaml
  # and local_overfit.yaml are untouched and the old shape is one line away.
  lr_schedule: linear
  lr_floor_ratio: 0.03

# ============================================================================
# THIS IS THE ABLATION CONTROL SURFACE.
#
# Flip ONE flag here to true and run `tests\overfit.bat` to measure that
# ablation against the baseline run. Everything else about this profile (subset,
# model scale, schedule, output paths) stays fixed, so the resulting loss curves
# in tests/output/overfitV2/epoch_metrics.csv differ only by the toggle you
# changed.
#
# `frozen_input_kv` IS NO LONGER LISTED HERE. It was promoted to a project-wide
# default on 2026-08-09 (owner decision, on arm-01 evidence: no meaningful loss
# difference, much faster inference), so this profile now INHERITS
# `frozen_input_kv: true` from config/default.yaml rather than pinning it off.
# Two consequences worth knowing before you launch:
#
#   1. This profile's stored architecture identity is now
#      `dense-multinomial-SC2-v2+frozen_input_kv`, so the pre-promotion
#      `checkpoints/local-overfitV2/last.pt` will NOT resume into it -- the
#      launch aborts on a fingerprint mismatch rather than training on the wrong
#      architecture. Archive `tests/output/overfitV2/` and move the old
#      checkpoint aside before rerunning `tests\overfit.bat`.
#   2. The completed prompt-009 sweep's all-false baseline arm lives on in
#      configs/ablation_00_baseline.yaml, which pins all three toggles false at
#      these same storage paths. That file -- not this one -- is what reproduces
#      the recorded baseline curves and loads the recorded baseline checkpoint.
#
# The two toggles below are still experiments. Enabling either changes the
# model's stored architecture identity (see `toggle_fingerprint` in
# src/thesis_ml/config.py), so a checkpoint trained with a toggle on will refuse
# to load into a model built without it and vice versa -- that is deliberate.
# Point `storage.checkpoint_uri` somewhere new before running an enabled
# ablation if you want to keep whatever sits in checkpoints/local-overfitV2.
#
#   segment_embeddings    -- learned 2-row embedding (0 = input, 1 = canvas)
#                            added to the final per-region embedding, so the
#                            same token id in the input and in the canvas is
#                            genuinely different to the model.
#   per_segment_positions -- RoPE position ids per segment: input real content
#                            gets 0..L_i-1 in its left-padded slots, canvas
#                            restarts at 0 at canvas index 0, so canvas
#                            positions no longer move with the batch's padding.
# ============================================================================
model:
  segment_embeddings: false
  per_segment_positions: false

diffusion:
  process: uniform
  schedule:
    # No exact-t=1 oversampling. t is drawn uniformly on [0, 1], so the
    # "t_eq_1" loss bucket is populated only by the measure-zero-in-theory but
    # occasionally-drawn exact 1.0, and mostly stays empty. The near-full
    # corruption regime is instead read from the "t_0_75_to_1_0" bucket. Raise
    # this above 0 if the exact-100%-corruption column needs to be dense.
    t_one_fraction: 0.0

# NOTE: this historical PRE-TRAINING profile inherits unit class weights from
# local_overfit.yaml so its original objective remains reproducible.
#
# Diagnostics this run writes to tests/output/overfitV2/ (see
# TrainingLoop._write_epoch_metrics for the full column list):
#   - epoch_metrics.csv    : one row per epoch (100 rows), carrying train AND dev
#     values for every loss sub-class below, plus timestep percentiles,
#     future-distance buckets, and memory/throughput telemetry.
#   - step_metrics.jsonl   : one line per optimizer step.
#   - interval_metrics.csv : NOT written by this profile. Both
#     train.interval_dev_evaluation and train.interval_train_evaluation are
#     false in local_overfit.yaml (see the reasoning there), so everything is
#     reported at the epoch boundary instead. The wiring is intact -- flip
#     either flag to restore the ten-rows-per-epoch file.
#
# Loss sub-classes reported per epoch:
#   per-class    : [PAD], [DELIMITER], [END], win-loss, enemy-observed
#                  (copying observed enemy tokens onto the canvas),
#                  enemy-fogged (reconstructing fogged enemy tokens), and
#                  enemy-future (predicting the future canvas region).
#   canvas-state : ground_truth_preserved (does the model recognize an
#                  already-correct token and keep it?) vs noised (does it repair
#                  a corrupted one?).
#   t-bucket     : overall loss at 0-25%, 25-75%, 75-<100%, and exactly 100%
#                  canvas corruption.
#   perspective  : p1 vs p2.
#   rare-class x t-bucket : the headline diagnostic for this run. The win/loss,
#                  [END], and [DELIMITER] tokens crossed with all four
#                  corruption buckets -- 12 loss columns and 12 position-count
#                  columns per split. Reading per-class and t-bucket side by side
#                  CANNOT answer the question these columns exist for, because
#                  each of those marginalizes away the other's axis: a win/loss
#                  token that is learned at low corruption and hopeless at high
#                  corruption shows up in per-class as one mediocre average. The
#                  count columns are what make the loss columns trustworthy --
#                  win_loss_* is one position per example, and [END] appears only
#                  in windows that reach game end, so a bucket can legitimately
#                  contain zero of them. A count of 0 (recorded as 0, not blank)
#                  says the empty loss cell is a sampling artifact rather than a
#                  result.

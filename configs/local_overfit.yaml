extends: ../config/default.yaml

storage:
  data_uri: ../data/quickstart/parquet
  checkpoint_uri: checkpoints/local-overfit
  log_uri: tests/output/overfit
  local_cache_dir: .pipeline_cache/local-overfit

data:
  sampling_interval_s: 1
  input_budget_tokens: 4096
  canvas_budget_tokens: 4096
  canvas_recon_fraction: 0.5
  debut_mode: false
  tokenized_replay_dir: data/processed/local/tokenized_replays
  # These budgets/fractions are IDENTICAL to configs/local_full.yaml, so this
  # profile's manifest config stamp matches the full run's. That means
  # overfit_window_manifest.jsonl can be seeded by copying the already-built
  # full_window_manifest.jsonl and preprocessing is skipped entirely, instead of
  # re-deriving windows for all 943 replays before a 10-replay run. It is a
  # SEPARATE file so a stamp mismatch can only ever rebuild the overfit
  # manifest, never clobber the full run's.
  window_manifest_path: data/processed/local/overfit_window_manifest.jsonl
  feature_statistics_path: data/processed/local/overfit_feature_statistics.v1.json

pipeline:
  seed: 1729
  split_seed: 1729
  batch_size: 10
  replay_glob: "*.parquet"
  num_workers: 4
  prefetch_factor: 4
  # Explicit, named replay subset -- this profile does NOT use the seeded
  # shuffle (replay_subset_size / validation_replay_count are therefore 0).
  #
  # HOW THESE 13 REPLAYS WERE CHOSEN (deterministic, no RNG): every replay was
  # ranked ascending by the total input tokens it contributes across all its
  # windows and both perspectives, tie-broken by replay id. The 13 replays at
  # ranks 465-477 of 943 -- the run centered on the median rank 471 -- were
  # taken; the first 10 are train, the last 3 are dev. They therefore sit at the
  # corpus median size (~108k-114k input tokens each vs a 111,860 corpus
  # median), which is the point: an overfit run must not be made artificially
  # easy by short replays or artificially slow by the long tail (the corpus max
  # is 1.49M input tokens, over 13x the median).
  #
  # Resulting shape: 334 train windows -> 34 optimizer steps/epoch at
  # batch_size 10, and 101 dev windows -> 11 batches per validation pass.
  replay_subset_size: 0
  validation_replay_count: 0
  train_replay_ids: "match_4746821_game_state,match_4746300_game_state,match_4746422_game_state,match_4746328_game_state,match_4746242_game_state,match_4746352_game_state,match_4746416_game_state,match_4746492_game_state,match_4745788_game_state,match_4745798_game_state"
  dev_replay_ids: "match_4746726_game_state,match_4746321_game_state,match_4746049_game_state"
  # Feature statistics are keyed to the EXACT train replay list and this profile
  # owns a named 10-replay list, so the frozen artifact is (re)built from those
  # replays on every launch rather than requiring a separate one-shot command.
  # It is deterministic and reads only 10 replays' windows, so recomputing it is
  # cheap and can never drift from the selection above.
  prepare_feature_statistics: true

model:
  d_model: 256
  layers: 10
  heads: 4
  ffn: 1024
  self_conditioning: true
  gradient_checkpointing: true

diffusion:
  process: uniform
  schedule:
    t_one_fraction: 0.0

train:
  # From-scratch LR schedule, declared explicitly here rather than inherited so
  # this profile can never silently pick up a value meant for another run.
  #   - lr: peak base learning rate (3e-4, the standard from-scratch value, the
  #     same one configs/local_full.yaml uses).
  #   - warmup: steps spent linearly ramping up to lr. This MUST stay well below
  #     the run's total steps. The inherited default is 2000, but this profile
  #     runs 34 steps/epoch x 150 epochs = 5100 steps total -- with warmup 2000
  #     the run would spend its first 39% still ramping, and at the previous
  #     30-epoch length (1020 steps) it would have ended while still ramping and
  #     never once trained at the configured rate, which reads as "the model
  #     refuses to learn". 40 steps is a little over one epoch of warmup. The
  #     loop prints an `lr_schedule` line at startup (with a WARNING when warmup
  #     >= target steps) so the effective rate is visible before any training
  #     happens.
  #
  # HOW THE COSINE DECAY IS FITTED TO THIS RUN'S LENGTH: `max_steps: 0` is not
  # "no limit" -- it is the signal that the schedule horizon must be DERIVED.
  # train_pipeline._run_real_pipeline computes
  # `planned_steps = len(train_loader) * train.epochs` and injects it as
  # `train.max_steps` before the TrainingLoop is constructed, and
  # TrainingLoop._lr_multiplier decays the cosine over exactly that horizon. So
  # the schedule re-fits itself to `epochs` automatically: at 30 epochs it decayed
  # to the lr_floor_ratio (0.1) floor over 1020 steps, and at 150 it stretches the
  # same shape over 5100. Verify from the run's own `lr=` prints, which walk from
  # 3.0e-4 down to 3.0e-5 across the whole run rather than bottoming out early.
  lr: 3.0e-4
  warmup: 40
  # 150 epochs, not 30. An aggressively augmented subset (per-serving fog, a
  # freshly sampled corruption level t per example per epoch) means the model
  # never sees the same training example twice, so short runs only have time to
  # memorize the easy, high-frequency positions. The rare tokens are the reason
  # for the length: the win/loss token appears exactly ONCE in a 4096-position
  # canvas, so it draws gradient every step but through ~0.02% of the scored
  # positions. Giving the run 5x the steps is what lets that signal accumulate
  # -- and the rare-class x t-bucket columns (see the diagnostics note in
  # local_overfit_v2.yaml) are what make it readable when it does.
  epochs: 150
  max_steps: 0
  # Overfitting is the POINT of this profile: it must be allowed to keep driving
  # train loss down on a subset it has memorized, so early stopping stays off.
  early_stopping_patience_epochs: 0
  early_stopping_min_relative_improvement: 0.001
  accumulation_steps: 1
  target_effective_batch_tokens: 0
  # ~1 checkpoint per epoch (34 steps/epoch) rather than per 3 epochs. Over 150
  # epochs this overwrites last.pt 150 times (keep_step_checkpoints stays false),
  # so disk use is flat and a crash costs at most one epoch of training.
  checkpoint_interval: 34
  # BOTH dev and train loss are reported ONCE per epoch, at the epoch end, and
  # this profile therefore emits no interval_metrics.csv rows at all.
  #
  # val_interval 0 disables the step-cadence validation. interval_dev_evaluation
  # false stops the ten per-epoch interval reports from each running their own
  # dev pass: measured on the RTX 3070, a train step is ~2.9s (34 per epoch,
  # ~105s) while a full dev pass over the 101 dev windows is ~18s, so ten
  # interval dev passes would add ~180s per epoch and roughly double the run.
  #
  # interval_train_evaluation false then does the same to the train side, for a
  # different reason -- it costs no compute, it costs SIGNAL. This profile runs
  # 34 batches per epoch, so a "10% of the epoch" slice is 3-4 batches; with a
  # fresh fog draw and a fresh corruption level t per example, the loss over 3
  # batches is dominated by which t values happened to be drawn. Across 150
  # epochs that would be 1500 rows of resampling noise. The per-epoch row
  # averages all 34 batches and gives 150 clean points, which is ample here.
  #
  # This is a REPORTING switch only. Every interval accumulator still runs, so
  # flipping either flag back to true restores the ten-per-epoch rows with no
  # other change -- which is what a full run (one epoch, needing intra-epoch
  # resolution) relies on, and why both default to true.
  val_interval: 0
  interval_dev_evaluation: false
  interval_train_evaluation: false
  confidence_loss_weight: 0.0
  self_cond_prob: 0.5
  precision: bf16
  require_cuda: true
  max_cuda_reserved_gb: 7.5
  empty_cuda_cache_after_epoch: true

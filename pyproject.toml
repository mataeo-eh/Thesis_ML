# pyproject.toml - uv workspace root for the two-arm thesis experiment.
#
# The repository holds three independently installable packages under packages/:
#
#   thesis-shared     framework-agnostic core - NO torch, NO tensorflow.
#                     Tokenization, vocabulary, windowing, input features,
#                     standardization statistics, replay splits, canvas decode,
#                     timing recovery, build-order extraction and metrics.
#                     This is the experiment's controlled constant: both arms
#                     import it, so both consume identical data and are scored
#                     by identical metrics.
#
#   thesis-diffusion  Arm A - uniform discrete diffusion, PyTorch.
#   thesis-ar         Arm B - autoregressive baseline, TensorFlow.
#
# Dependencies flow ONE way: each arm depends on thesis-shared. Neither arm may
# depend on the other, and neither framework may reach the shared package.
#
# ENVIRONMENTS. The two arms are installed into SEPARATE virtual environments and
# are never installed together. A single Python process loads exactly one CUDA
# runtime, so co-installing the cu130 Torch wheels with TensorFlow's bundled CUDA
# libraries produces import errors or silent ABI mismatches.
#
#   Local Windows dev env (.venv)  -> this root project: shared + diffusion.
#                                     `uv sync`
#   AR verification env            -> a separate venv, shared + ar only:
#                                     `uv venv .venv-tf`
#                                     `uv pip install -e packages/thesis-shared \
#                                                     -e packages/thesis-ar`
#   Linux cloud training env       -> per-arm, built from that arm's package only.
#
# Installing thesis-ar into .venv is a mistake, not a shortcut.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-ml"
version = "0.0.1"
description = "Workspace root: SC2 strategy prediction, discrete diffusion vs autoregressive comparison"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Mataeo John Anderson" }]
# The local Windows development environment is the DIFFUSION arm. thesis-ar is
# deliberately absent here; see the environment note above.
dependencies = [
    "thesis-shared",
    "thesis-diffusion",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
thesis-shared = { workspace = true }
thesis-diffusion = { workspace = true }
thesis-ar = { workspace = true }

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end tests that build artifacts / sample the model (deselect with -m 'not slow')",
    "tensorflow: Arm B tests; require the separate AR environment, not .venv",
]
# Never collect from generated launcher-run artifacts under tests/output/ (they
# contain scratch .py files and OS-permission-locked directories that break
# collection); "output" extends pytest's default norecursedirs set, which is
# restated here because setting the option REPLACES the defaults.
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "output",
    "{arch}",
]

# The workspace root ships no importable package of its own; it exists to pin the
# workspace and hold shared tooling configuration.
[tool.setuptools]
py-modules = []

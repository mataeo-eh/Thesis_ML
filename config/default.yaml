data:
  sampling_interval_s: 1
  input_budget_tokens: 4096
  canvas_budget_tokens: 4096
  canvas_recon_fraction: 0.5
  within_type_tiebreak: unit_id
  tokenized_replay_dir: data/processed/tokenized_replays
  window_manifest_path: data/processed/window_manifest.jsonl
  feature_statistics_path: data/processed/feature_statistics.v1.json
  # Debut build-order + win/loss fine-tuning target mode. Both modes retain the
  # same clamped input/fog contract; this switch selects the canvas body.
  debut_mode: false

fog:
  rate_distribution:
    # Beta(power, 1) sampled by x = U ** (1 / power), then scaled to min/max.
    # power=2 intentionally favors heavier enemy omission while retaining the
    # full 0.0-0.8 support.
    name: power
    min: 0.0
    max: 0.8
    power: 2.0

model:
  d_model: 384
  layers: 12
  heads: 6
  ffn: 1536
  qk_norm: true
  self_conditioning: true
  gradient_checkpointing: false
  # Architecture toggles. `segment_embeddings` and `per_segment_positions` are
  # still ABLATION EXPERIMENTS and stay false (see SPEC.md 14b);
  # `frozen_input_kv` has been PROMOTED TO A DEFAULT and is true below.
  #
  # Run the input region alone through all L blocks first (attending only to
  # itself, caching each layer's K/V), then run the canvas attending to
  # concat(cached_input_K, canvas_K), instead of one joint bidirectional pass.
  # At inference the input KV is computed once and reused for every denoising
  # step rather than recomputed per step.
  #
  # WHY TRUE (owner decision, 2026-08-09, on measured evidence): ablation arm 01
  # (configs/ablation_01_frozen_input_kv.yaml, 100 epochs against the all-false
  # baseline) showed no statistically meaningful loss difference while cutting
  # inference time substantially -- the input region is static across every
  # denoising step, so recomputing its K/V 64 times per sample was pure waste.
  # The accepted semantic cost is that the input no longer attends to the canvas,
  # making attention one-directional across the input/canvas seam (SPEC.md 14a).
  #
  # WHAT THIS DOES TO CHECKPOINT IDENTITY: `toggle_fingerprint` is deliberately
  # NOT rebased. A default-derived model now stamps
  # `dense-multinomial-SC2-v2+frozen_input_kv`, so pre-promotion all-off
  # checkpoints fail closed on load instead of silently entering a two-pass model
  # -- and ablation arms 01/05, which pin this true themselves, keep the exact
  # identity they were trained under. Set this to false in a profile to opt back
  # out; configs/ablation_00_baseline.yaml does precisely that to keep the
  # completed sweep's baseline reproducible.
  frozen_input_kv: true
  # Add a learned 2-row embedding (0 = input segment, 1 = canvas segment) to the
  # final per-region embedding, so the same token id in the input and in the
  # canvas is genuinely different to the model.
  segment_embeddings: false
  # Compute RoPE position ids per segment: input real content gets 0..L_i-1 in
  # its left-padded slots and the canvas restarts at 0 at canvas index 0, making
  # canvas positions invariant to how much left padding a batch needed.
  per_segment_positions: false
  rope_theta: 500000.0
  rope_scaling:
    rope_type: llama3
    factor: 8.0
    low_freq_factor: 1.0
    high_freq_factor: 4.0
    original_max_position_embeddings: 8192

diffusion:
  process: uniform
  schedule:
    name: linear
    t_distribution: power
    # Beta(power, 1); 2.0 gives density 2t and therefore emphasizes high-noise
    # conditioning without removing low-noise examples entirely.
    t_distribution_power: 2.0
    min: 0.0
    max: 1.0
    # Fraction of examples per epoch (per-example Bernoulli, in expectation)
    # oversampled to t=1.0 exactly. Applies to both pre-training and
    # fine-tuning pipelines.
    t_one_fraction: 0.05

storage:
  data_uri: data/processed/quickstart
  raw_uri: data/raw/replays
  checkpoint_uri: checkpoints
  log_uri: logs
  local_cache_dir: .pipeline_cache

data_source:
  source: kaggle
  kaggle_dataset: mataeoanderson/sc2-replay-data
  kaggle_username_env: KAGGLE_USERNAME
  kaggle_key_env: KAGGLE_KEY
  extractor_path: ../SC2-gamestate-extractor
  extractor_command: python quickstart.py
  workers: 4

pipeline:
  auto_acquire: false
  smoke: false
  smoke_steps: 2
  seed: 123
  batch_size: 8
  replay_glob: "*.parquet"
  token_dictionary_uri: data/Token_Dictionary.json
  perspectives: p1,p2
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  cache_ram_fraction: 0.5
  split_seed: 1234
  test_fraction: 0.15
  dev_fraction: 0.10
  train_replay_count: 0
  replay_subset_size: 0
  validation_replay_count: 0
  # Explicit named replay selection (comma-separated replay file stems). Empty
  # keeps the seeded-shuffle split; see PipelineConfig.train_replay_ids.
  train_replay_ids: ""
  dev_replay_ids: ""
  preprocess_if_missing: true
  rebuild_manifest: false
  # Explicit one-shot preprocessing control. Normal train/eval leaves this
  # false and requires the frozen training-split artifact to already exist.
  prepare_feature_statistics: false

train:
  lr: 0.0003
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  adam_eps: 0.00000001
  # `warmup` is the absolute step warmup retained by the legacy cosine/linear
  # schedules. WSD uses the three horizon ratios below instead.
  warmup: 2000
  lr_floor_ratio: 0.01
  lr_schedule: wsd
  lr_warmup_ratio: 0.10
  lr_stable_ratio: 0.70
  lr_decay_ratio: 0.20
  grad_clip: 1.0
  accum: as-needed
  accumulation_steps: 5
  target_effective_batch_tokens: 0
  max_steps: 100000
  epochs: 6
  early_stopping_patience_epochs: 0
  early_stopping_min_relative_improvement: 0.001
  val_interval: 1000
  # Run a full dev pass at each of the ten per-epoch interval reports. Default
  # true so a single-epoch run still gets ten dev observations; set false when
  # the dev pass costs more than the training it interleaves with.
  interval_dev_evaluation: true
  # Carry train values in those same ten per-epoch interval reports. Default
  # true; set false on a many-epoch run where a ~10% slice is only a few batches
  # and the per-epoch row already carries the trend. Both false = no interval
  # rows at all.
  interval_train_evaluation: true
  checkpoint_interval: 1000
  checkpoint_dir: checkpoints
  resume_checkpoint_subdir: resume
  best_checkpoint_subdir: best
  durable_checkpoint_subdir: durable
  save_best_checkpoint: true
  durable_checkpoint_interval_epochs: 5
  keep_step_checkpoints: false
  # CEILING on the EMA decay. The decay actually used is DERIVED from the run's
  # own step horizon (TrainingLoop._resolve_ema_decay) as
  # `1 - 1/(ema_horizon_ratio * total_steps)` and then clamped to at most this
  # value. 0.9999 is a ~10,000-step averaging window, so a run of 100,000 steps
  # or more sits exactly at this ceiling and behaves as it always has; shorter
  # runs get a proportionally shorter window instead of an EMA that never
  # finishes traversing its own.
  ema_decay: 0.9999
  # EMA averaging window as a fraction of the run's total optimizer steps. 0.1
  # means the served EMA weights always average over roughly the final 10% of
  # training, whatever the epoch budget, and the EMA completes ~10 window
  # lengths before the last step.
  ema_horizon_ratio: 0.1
  confidence_loss_weight: 0.0
  self_cond_prob: 0.5
  precision: bf16
  require_cuda: false
  max_cuda_reserved_gb: 0.0
  empty_cuda_cache_after_epoch: false
  # Weights-only fine-tune warm-start source. Empty string = disabled (the
  # pre-training pipeline never sets this, so it always trains from scratch
  # / full-resumes as before). See TrainingLoop.load_model_weights.
  init_from_checkpoint: ""

sampler:
  max_steps: 64
  temperature:
    start: 0.8
    end: 0.4
    exponent: 1.0
  entropy_bound: 0.1
  adaptive_stop: true
  entropy_threshold: 0.005
  stability_steps: 2

eval:
  heldout_split: validation
  timing_tolerance_buckets: 1
  fog_rate: 0.0
  debut_minute_buckets: "1,3,5,7,10"
  debut_fog_bucket_edges: "0.3,0.7"
  debut_max_examples: 0

loss:
  use_fused_cross_entropy: false
  class_loss_weights:
    enemy_observed_reconstruction: 1.0
    enemy_fogged_reconstruction: 1.0
    enemy_future_prediction: 1.0
    delimiter: 1.0
    # 42,862 train windows / 1,740 terminal train windows in the canonical
    # 870-replay split. This gives [END] approximately the same total weighted
    # occurrence mass as the once-per-window [WIN]/[LOSS] target.
    end: 24.633333333333333
    pad: 0.1
    win_loss: 1.0

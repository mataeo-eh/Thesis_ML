# Explicit NEW default for the preview workflow. This is not a training profile.
# Missing/unknown sequence_format fails before opening any replay.
sequence_format: unconditioned_joint_v1
context_budget_tokens: 8192
project_config: default.yaml
perspective: p1
replay_path: ""
input_directory: ../../data/quickstart/parquet
output_directory: ../scripts/output/sequence_preview
tokenizer: atomic
bpe_min_occurrences: 3
# Window the anchor replay plus the next replay in sorted filename order, and
# pack the second replay's opening timesteps into the space after the first
# replay's [END]. Exports the first window and the first packed window.
replay_count: 2
pack_replays: true

context_budget_tokens: 8192
project_config: default.yaml
perspective: p1
replay_path: ""
input_directory: ../../data/quickstart/parquet
output_directory: ../scripts/output/sequence_preview
tokenizer: atomic
bpe_min_occurrences: 3

# pyproject.toml - thesis-shared: framework-agnostic core shared by both arms.
#
# This package is the controlled constant of the thesis experiment. Both the
# diffusion arm (PyTorch) and the autoregressive arm (TensorFlow) depend on it,
# which is what guarantees they consume identical tokenization, windowing,
# features, splits, and scoring metrics.
#
# It deliberately declares NEITHER torch NOR tensorflow as a dependency. Adding
# either to this file is a contract violation: it would drag a framework into
# the other arm's environment and defeat the point of the split.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-shared"
version = "0.0.1"
description = "Framework-agnostic core (tokenization, windowing, features, splits, metrics) shared by both thesis experiment arms"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Mataeo John Anderson" }]
dependencies = [
    "boto3>=1.34",
    "kaggle>=1.6",
    "matplotlib>=3.7",
    "pandas>=2.1",
    "psutil>=5.9",
    "pyarrow>=12.0",
    "PyYAML>=6.0",
]

[project.scripts]
thesis-acquire = "thesis_shared.pipeline.acquire_data:main"

[tool.setuptools.packages.find]
where = ["src"]
